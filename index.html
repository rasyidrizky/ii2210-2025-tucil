<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message of The Day</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #00b4db, #0083b0);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #ffffff;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      max-width: 600px;
      width: 90%;
    }

    .title {
      font-size: 2em;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .motd {
      font-size: 1.5em;
      color: #ffffff;
      background-color: rgba(0, 0, 0, 0.2);
      padding: 20px;
      border-radius: 10px;
    }

    @media (max-width: 600px) {
      .motd {
        font-size: 1.2em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">🌟 Message of The Day 🌟</div>
    <div class="motd">{{ message }}</div>
  </div>
</body>
</html>
